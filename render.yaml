services:
  - type: web
    name: store-product-management
    runtime: node
    # 免绑卡备用方案：Free 可公网访问，但闲置 15 分钟后会休眠，首次唤醒约需一分钟。
    # 正式长期使用时改回 starter 并完成付款验证。
    plan: free
    region: oregon
    buildCommand: npm ci && npm ci --prefix server && npm ci --prefix client && npm run db:generate && npm run build
    startCommand: npm run db:deploy && npm run start:cloud
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
